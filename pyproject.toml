[project]
name = "biorewards"
version = "0.1.0"
description = "Deterministic verifiable rewards for biology agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# per-verifier heavy deps stay optional so the core installs anywhere
fba = ["cobra>=0.29"]
citation = ["requests>=2.31"]
smallmolecule = ["rdkit>=2023"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biorewards"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
